<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeopardy Flashcards</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #060ce9;
      --blue-dark: #0509a0;
      --blue-deeper: #030770;
      --blue-card: #0a0db8;
      --gold: #ffb700;
      --gold-dark: #cc9200;
      --white: #ffffff;
      --gray: #d0d4ff;
      --green: #22c55e;
      --red: #ef4444;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Georgia', serif;
      background: var(--blue-deeper);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      background: var(--blue-dark);
      border-bottom: 4px solid var(--gold);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      font-size: 2rem;
      font-weight: bold;
      font-style: italic;
      color: var(--gold);
      text-shadow: 2px 2px 0 #000, 0 0 20px rgba(255,183,0,0.5);
      letter-spacing: 2px;
      flex: 1;
    }

    .back-btn {
      background: transparent;
      border: 2px solid var(--gold);
      color: var(--gold);
      padding: 0.4rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.2s;
      display: none;
    }
    .back-btn:hover { background: var(--gold); color: #000; }
    .back-btn.visible { display: block; }

    .screen { display: none; padding: 1.5rem; max-width: 900px; margin: 0 auto; }
    .screen.active { display: block; }

    /* HOME */
    .home-intro { text-align: center; margin-bottom: 1.5rem; }
    .home-intro h2 { font-size: 1.1rem; color: var(--gray); font-weight: normal; }

    .source-badge {
      display: inline-block;
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-family: sans-serif;
      margin-top: 0.5rem;
    }
    .badge-bundled { background: rgba(255,183,0,0.15); border: 1px solid var(--gold); color: var(--gold); }
    .badge-live { background: rgba(34,197,94,0.15); border: 1px solid var(--green); color: var(--green); }

    .random-btn {
      background: var(--gold);
      color: #000;
      border: none;
      padding: 0.85rem 2.5rem;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow);
    }
    .random-btn:hover { background: var(--gold-dark); }
    .random-btn:active { transform: scale(0.97); }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.25rem 0;
      color: var(--gray);
      font-size: 0.9rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.2);
    }

    .search-box { position: relative; margin-bottom: 1.25rem; }
    .search-box input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.8rem;
      background: var(--blue-card);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: var(--white);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .search-box input:focus { border-color: var(--gold); }
    .search-box input::placeholder { color: rgba(255,255,255,0.4); }
    .search-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); opacity: 0.4; }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.65rem;
      margin-bottom: 1.25rem;
    }

    .category-card {
      background: var(--blue-card);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 0.9rem 0.75rem;
      cursor: pointer;
      transition: all 0.18s;
      text-align: center;
      -webkit-user-select: none;
      user-select: none;
    }
    .category-card:hover, .category-card:active {
      border-color: var(--gold);
      background: var(--blue-dark);
      transform: translateY(-2px);
    }
    .cat-title {
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gold);
      margin-bottom: 0.25rem;
      line-height: 1.3;
    }
    .cat-count { font-size: 0.72rem; color: var(--gray); }

    .load-more-btn {
      display: block;
      width: 100%;
      background: transparent;
      border: 2px solid rgba(255,255,255,0.15);
      color: var(--gray);
      padding: 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }
    .load-more-btn:hover { border-color: var(--gold); color: var(--gold); }

    .status-msg { text-align: center; padding: 2rem; color: var(--gray); font-style: italic; }

    /* DRILL */
    .drill-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .drill-category {
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gold);
      line-height: 1.2;
    }
    .drill-progress { color: var(--gray); font-size: 0.9rem; white-space: nowrap; }

    .score-bar { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .score-pill {
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      font-family: sans-serif;
    }
    .score-correct { background: rgba(34,197,94,0.15); border: 1px solid var(--green); color: var(--green); }
    .score-incorrect { background: rgba(239,68,68,0.15); border: 1px solid var(--red); color: var(--red); }
    .score-remaining { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: var(--gray); }

    .progress-track {
      height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      margin-bottom: 1.25rem;
      overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.4s; }

    /* FLASHCARD */
    .card-container { perspective: 1200px; margin-bottom: 1.25rem; cursor: pointer; }
    .card-inner {
      position: relative;
      width: 100%;
      min-height: 260px;
      transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card-inner.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      min-height: 260px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.75rem;
      box-shadow: var(--shadow);
    }
    .card-front {
      background: linear-gradient(145deg, var(--blue-card), var(--blue-dark));
      border: 2px solid rgba(255,183,0,0.25);
    }
    .card-back {
      background: linear-gradient(145deg, #0d1580, #060aa0);
      border: 2px solid rgba(255,183,0,0.45);
      transform: rotateY(180deg);
    }

    .card-value { font-size: 1.4rem; font-weight: bold; color: var(--gold); margin-bottom: 0.9rem; }
    .card-clue { font-size: 1.35rem; text-align: center; line-height: 1.5; }
    .card-hint { margin-top: 1.25rem; font-size: 0.75rem; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 2px; font-family: sans-serif; }
    .card-answer-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); margin-bottom: 0.6rem; opacity: 0.8; font-family: sans-serif; }
    .card-answer { font-size: 1.45rem; text-align: center; line-height: 1.4; font-style: italic; }

    .action-btns {
      display: flex;
      gap: 0.85rem;
      justify-content: center;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.25s 0.15s;
      pointer-events: none;
    }
    .action-btns.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

    .action-btn {
      flex: 1;
      max-width: 200px;
      padding: 0.9rem 1.25rem;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-correct { background: var(--green); color: #fff; }
    .btn-correct:hover { background: #16a34a; }
    .btn-incorrect { background: var(--red); color: #fff; }
    .btn-incorrect:hover { background: #dc2626; }

    /* SUMMARY */
    .summary-card {
      background: var(--blue-card);
      border: 2px solid var(--gold);
      border-radius: 16px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }
    .summary-title { font-size: 1rem; color: var(--gray); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.4rem; font-family: sans-serif; }
    .summary-score { font-size: 3.5rem; font-weight: bold; color: var(--gold); margin: 0.4rem 0; }
    .summary-label { font-size: 1rem; color: var(--gray); margin-bottom: 1.75rem; }
    .summary-stats { display: flex; justify-content: center; gap: 2.5rem; margin-bottom: 1.75rem; }
    .stat { text-align: center; }
    .stat-num { font-size: 1.9rem; font-weight: bold; }
    .stat-label { font-size: 0.72rem; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; font-family: sans-serif; }
    .summary-btns { display: flex; gap: 0.85rem; justify-content: center; flex-wrap: wrap; }
    .summary-btn { padding: 0.8rem 1.75rem; border-radius: 8px; font-size: 0.95rem; font-weight: bold; font-family: inherit; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: var(--gold); color: #000; border: none; }
    .btn-primary:hover { background: var(--gold-dark); }
    .btn-secondary { background: transparent; color: var(--gold); border: 2px solid var(--gold); }
    .btn-secondary:hover { background: var(--gold); color: #000; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,183,0,0.25);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 2rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .logo { font-size: 1.5rem; }
      .card-clue { font-size: 1.15rem; }
      .card-answer { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">JEOPARDY!</div>
  <button class="back-btn" id="backBtn" onclick="goHome()">&#8592; Categories</button>
</header>

<div id="homeScreen" class="screen active">
  <div class="home-intro">
    <h2>Pick a category to drill, or try random clues</h2>
    <div id="sourceBadge" class="source-badge badge-bundled">20 bundled categories &bull; loading live data&hellip;</div>
  </div>
  <div style="text-align:center; margin-bottom:1.25rem;">
    <button class="random-btn" onclick="startRandomDrill()">&#9733; Random Drill</button>
  </div>
  <div class="divider">browse categories</div>
  <div class="search-box">
    <span class="search-icon">&#128269;</span>
    <input type="text" id="searchInput" placeholder="Search categories&hellip;" oninput="filterCategories()" autocomplete="off">
  </div>
  <div id="categoriesContainer" class="categories-grid"></div>
  <div id="loadMoreWrap" style="display:none;">
    <button class="load-more-btn" onclick="loadMoreFromAPI()">Load more from live API&hellip;</button>
  </div>
</div>

<div id="drillScreen" class="screen">
  <div class="drill-header">
    <div class="drill-category" id="drillCategoryName"></div>
    <div class="drill-progress" id="drillProgress"></div>
  </div>
  <div class="score-bar">
    <span class="score-pill score-correct" id="scoreCorrect">&#10003; 0</span>
    <span class="score-pill score-incorrect" id="scoreIncorrect">&#10007; 0</span>
    <span class="score-pill score-remaining" id="scoreRemaining">0 left</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="card-container" id="cardContainer" onclick="flipCard()">
    <div class="card-inner" id="cardInner">
      <div class="card-face card-front">
        <div class="card-value" id="cardValue"></div>
        <div class="card-clue" id="cardClue"></div>
        <div class="card-hint">Tap to reveal answer</div>
      </div>
      <div class="card-face card-back">
        <div class="card-answer-label">The correct response is&hellip;</div>
        <div class="card-answer" id="cardAnswer"></div>
      </div>
    </div>
  </div>
  <div class="action-btns" id="actionBtns">
    <button class="action-btn btn-incorrect" onclick="markAnswer(false)">&#10007; Missed it</button>
    <button class="action-btn btn-correct" onclick="markAnswer(true)">&#10003; Got it!</button>
  </div>
</div>

<div id="summaryScreen" class="screen">
  <div class="summary-card">
    <div class="summary-title" id="summaryCategory"></div>
    <div class="summary-score" id="summaryPercent"></div>
    <div class="summary-label" id="summaryLabel"></div>
    <div class="summary-stats">
      <div class="stat"><div class="stat-num" style="color:var(--green)" id="summaryCorrect"></div><div class="stat-label">Correct</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--red)" id="summaryIncorrect"></div><div class="stat-label">Missed</div></div>
      <div class="stat"><div class="stat-num" id="summaryTotal"></div><div class="stat-label">Total</div></div>
    </div>
    <div class="summary-btns">
      <button class="summary-btn btn-primary" onclick="retryDrill()">&#8635; Try Again</button>
      <button class="summary-btn btn-secondary" onclick="goHome()">&#8592; Categories</button>
    </div>
  </div>
</div>

// ── STATE ─────────────────────────────────────────────────────────────────────

const state = {
  categories: [...BUNDLED],  // starts with bundled, API results appended
  apiOffset: 0,
  apiLoaded: false,
  clues: [],
  currentIndex: 0,
  flipped: false,
  correct: 0,
  incorrect: 0,
  categoryName: '',
  lastCategoryId: null,
  isRandom: false,
};

// ── SCREENS ───────────────────────────────────────────────────────────────────

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('backBtn').classList.toggle('visible', id !== 'homeScreen');
  window.scrollTo(0, 0);
}

function goHome() { showScreen('homeScreen'); }

// ── API ───────────────────────────────────────────────────────────────────────

async function apiFetch(path, timeoutMs = 8000) {
  const url = 'https://jservice.io/api' + path;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) {
    clearTimeout(timer);
    // Try CORS proxy fallback
    const proxy = 'https://corsproxy.io/?' + encodeURIComponent(url);
    const ctrl2 = new AbortController();
    const timer2 = setTimeout(() => ctrl2.abort(), timeoutMs);
    try {
      const res2 = await fetch(proxy, { signal: ctrl2.signal });
      clearTimeout(timer2);
      if (!res2.ok) throw new Error('HTTP ' + res2.status);
      return await res2.json();
    } catch (e2) {
      clearTimeout(timer2);
      throw e2;
    }
  }
}

// ── CATEGORIES ────────────────────────────────────────────────────────────────

function renderCategories() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = query
    ? state.categories.filter(c => c.title.toLowerCase().includes(query))
    : state.categories;

  const container = document.getElementById('categoriesContainer');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="status-msg">No matching categories.</div>';
    return;
  }
  container.innerHTML = filtered.map(c => `
    <div class="category-card" onclick="startCategoryDrill('${c.id}', \`${c.title.replace(/`/g,'\\`')}\`)">
      <div class="cat-title">${escHtml(c.title)}</div>
      <div class="cat-count">${c.clues_count} clue${c.clues_count !== 1 ? 's' : ''}</div>
    </div>
  `).join('');
}

function filterCategories() { renderCategories(); }

async function tryLoadLiveCategories() {
  try {
    const data = await apiFetch('/categories?count=100&offset=0');
    const fresh = data.filter(c => c.clues_count > 0 && !state.categories.find(e => e.id === c.id));
    if (fresh.length > 0) {
      state.apiOffset = 100;
      state.apiLoaded = true;
      state.categories.push(...fresh);
      renderCategories();
      document.getElementById('loadMoreWrap').style.display = 'block';
      document.getElementById('sourceBadge').className = 'source-badge badge-live';
      document.getElementById('sourceBadge').textContent = `${state.categories.length} categories loaded (live + bundled)`;
    }
  } catch (e) {
    document.getElementById('sourceBadge').className = 'source-badge badge-bundled';
    document.getElementById('sourceBadge').textContent = '100 real categories (offline mode)';
  }
}

async function loadMoreFromAPI() {
  const btn = document.querySelector('.load-more-btn');
  btn.textContent = 'Loading…';
  btn.disabled = true;
  try {
    const data = await apiFetch(`/categories?count=100&offset=${state.apiOffset}`);
    const fresh = data.filter(c => c.clues_count > 0 && !state.categories.find(e => e.id === c.id));
    state.apiOffset += 100;
    state.categories.push(...fresh);
    renderCategories();
    document.getElementById('sourceBadge').textContent = `${state.categories.length} categories loaded`;
    if (data.length < 100) document.getElementById('loadMoreWrap').style.display = 'none';
  } catch (e) {
    btn.textContent = 'Failed to load — retry?';
  } finally {
    btn.textContent = 'Load more from live API…';
    btn.disabled = false;
  }
}

// ── DRILL ─────────────────────────────────────────────────────────────────────

async function startCategoryDrill(categoryId, categoryTitle) {
  state.lastCategoryId = categoryId;
  state.isRandom = false;
  state.categoryName = categoryTitle;
  showScreen('drillScreen');
  document.getElementById('drillCategoryName').textContent = categoryTitle;
  document.getElementById('cardContainer').style.visibility = 'hidden';
  document.getElementById('actionBtns').classList.remove('visible');

  let spinner = document.createElement('div');
  spinner.className = 'spinner';
  spinner.id = 'drillSpinner';
  document.getElementById('drillScreen').appendChild(spinner);

  try {
    let clues;
    // Use bundled data for bundled categories
    if (String(categoryId).startsWith('b')) {
      const cat = BUNDLED.find(c => c.id === categoryId);
      clues = cat ? cat.clues : [];
    } else {
      const data = await apiFetch(`/clues?category=${categoryId}`);
      clues = data.filter(c => c.question && c.answer && c.question.trim() && c.answer.trim() && c.question !== '=' && c.answer !== '=');
    }
    if (clues.length === 0) throw new Error('No valid clues');
    document.getElementById('drillSpinner')?.remove();
    document.getElementById('cardContainer').style.visibility = 'visible';
    initDrill(shuffleArray(clues));
  } catch (e) {
    document.getElementById('drillSpinner')?.remove();
    document.getElementById('cardContainer').style.visibility = 'visible';
    document.getElementById('cardClue').textContent = 'Failed to load clues. Try another category.';
    document.getElementById('cardValue').textContent = '';
  }
}

async function startRandomDrill() {
  state.isRandom = true;
  state.categoryName = 'Random Clues';
  showScreen('drillScreen');
  document.getElementById('drillCategoryName').textContent = 'Random Clues';
  document.getElementById('cardContainer').style.visibility = 'hidden';
  document.getElementById('actionBtns').classList.remove('visible');

  let spinner = document.createElement('div');
  spinner.className = 'spinner';
  spinner.id = 'drillSpinner';
  document.getElementById('drillScreen').appendChild(spinner);

  let clues = null;
  try {
    const data = await apiFetch('/random?count=20');
    clues = data.filter(c => c.question && c.answer && c.question.trim() && c.answer.trim() && c.question !== '=' && c.answer !== '=');
  } catch (e) { /* fall through to bundled */ }

  if (!clues || clues.length < 5) {
    // Fall back to random sample from bundled data
    const all = BUNDLED.flatMap(c => c.clues);
    clues = shuffleArray(all).slice(0, 20);
  }

  document.getElementById('drillSpinner')?.remove();
  document.getElementById('cardContainer').style.visibility = 'visible';
  initDrill(clues);
}

function initDrill(clues) {
  state.clues = clues;
  state.currentIndex = 0;
  state.correct = 0;
  state.incorrect = 0;
  state.flipped = false;
  updateScoreBar();
  showCard(0);
}

function retryDrill() {
  if (state.isRandom) startRandomDrill();
  else startCategoryDrill(state.lastCategoryId, state.categoryName);
}

// ── CARD ──────────────────────────────────────────────────────────────────────

function showCard(index) {
  const clue = state.clues[index];
  state.flipped = false;
  document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('actionBtns').classList.remove('visible');

  document.getElementById('cardValue').textContent = clue.value ? `$${clue.value}` : 'FINAL';
  document.getElementById('cardClue').textContent = clue.answer;
  document.getElementById('cardAnswer').textContent = clue.question;

  const total = state.clues.length;
  document.getElementById('drillProgress').textContent = `${index + 1} / ${total}`;
  document.getElementById('progressFill').style.width = `${(index / total) * 100}%`;
  updateScoreBar();
}

function flipCard() {
  if (state.flipped) return;
  state.flipped = true;
  document.getElementById('cardInner').classList.add('flipped');
  document.getElementById('actionBtns').classList.add('visible');
}

function markAnswer(wasCorrect) {
  if (wasCorrect) state.correct++; else state.incorrect++;
  const next = state.currentIndex + 1;
  if (next >= state.clues.length) {
    document.getElementById('progressFill').style.width = '100%';
    setTimeout(showSummary, 350);
  } else {
    state.currentIndex = next;
    showCard(next);
  }
}

function updateScoreBar() {
  const done = state.correct + state.incorrect;
  const left = state.clues.length - done;
  document.getElementById('scoreCorrect').textContent = `✓ ${state.correct}`;
  document.getElementById('scoreIncorrect').textContent = `✗ ${state.incorrect}`;
  document.getElementById('scoreRemaining').textContent = `${left} left`;
}

// ── SUMMARY ───────────────────────────────────────────────────────────────────

function showSummary() {
  const total = state.clues.length;
  const pct = total > 0 ? Math.round((state.correct / total) * 100) : 0;
  document.getElementById('summaryCategory').textContent = state.categoryName;
  document.getElementById('summaryPercent').textContent = `${pct}%`;
  document.getElementById('summaryLabel').textContent =
    pct === 100 ? "Perfect — Alex would be proud!" :
    pct >= 80  ? "Excellent — you're ready for the show!" :
    pct >= 60  ? "Good work — keep studying!" :
    pct >= 40  ? "Getting there — practice makes perfect." :
                 "Tough category — try again!";
  document.getElementById('summaryCorrect').textContent = state.correct;
  document.getElementById('summaryIncorrect').textContent = state.incorrect;
  document.getElementById('summaryTotal').textContent = total;
  showScreen('summaryScreen');
}

// ── UTILS ─────────────────────────────────────────────────────────────────────

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── INIT ──────────────────────────────────────────────────────────────────────

renderCategories();           // show bundled immediately
tryLoadLiveCategories();      // then try to add live API data in background
</script>
